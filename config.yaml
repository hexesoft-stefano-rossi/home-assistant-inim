name: "Hexesoft Inim"
description: "Bridge tra centrale Inim Prime PR500 e Home Assistant via MQTT."
version: "1.2.5"
slug: "hexesoft_inim"
arch:
  - aarch64
  - amd64
host_network: true
startup: application
boot: auto


options:
  inim:
    host: ""
    port: 6004
    password: ""
    # Dalla versione 1.2.0 il bridge non usa più questo PIN per inserire,
    # disinserire, applicare scenari o fermare allarmi: quelle azioni
    # richiedono sempre il PIN digitato in HA dall'utente che le esegue.
    # Il PIN qui serve solo per polling, lettura log, lettura stato scenari
    # e discovery.
    #
    # Consigliato: crea in centrale un utente dedicato (es. "HA Bridge")
    # con questi permessi (vedi CHANGELOG 1.2.3 per i dettagli):
    #  - Tipo: Utente
    #  - Tutte le aree spuntate
    #  - Abilitazioni: solo "Menu visualizzazione" + "Menu gestione allarmi"
    #  - Nessuna uscita abilitata
    # Poi metti qui il PIN di quell'utente.
    pin: "0000"
    connectiontype: 2
    contactpollinterval: 5

  mqtt:
    host: "core-mosquitto"
    port: 1883
    username: ""
    password: ""
    basetopic: "inim_bridge"
    discoveryprefix: "homeassistant"

  systemsettings:
    loglevel: "info"

schema:
  inim:
    host: str
    port: int
    password: password
    pin: str
    connectiontype: int
    contactpollinterval: int

  mqtt:
    host: str
    port: int
    username: str?
    password: password?
    basetopic: str
    discoveryprefix: str

  systemsettings:
    loglevel: list(info|debug|warning|error)
